/* ============================================================
   Utilities
   ============================================================ */
const ri = (a,b) => Math.floor(Math.random()*(b-a+1)) + a;
const pick = a => a[Math.floor(Math.random()*a.length)];

function shuffle(a){
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}
function popcount(n){
  n = n >>> 0; let c = 0;
  while(n){ c += n & 1; n >>>= 1; }
  return c;
}
function hexB(n){ return '0x' + (n & 0xFF).toString(16).toUpperCase().padStart(2,'0'); }
function hexW(n){ return '0x' + (n >>> 0).toString(16).toUpperCase().padStart(8,'0'); }
function bin8(n){
  const s = (n & 0xFF).toString(2).padStart(8,'0');
  return s.slice(0,4) + ' ' + s.slice(4);
}

/* Build a multiple-choice question from a correct answer + distractors */
function makeQ(prompt, correct, distractors, explanation, topic, difficulty){
  const correctS = String(correct);
  const opts = [correctS];
  const seen = new Set([correctS]);

  for(const d of distractors){
    const ds = String(d);
    if(opts.length >= 4) break;
    if(seen.has(ds)) continue;
    seen.add(ds);
    opts.push(ds);
  }
  let pad = 0;
  while(opts.length < 4){
    const cand = String(pad++);
    if(!seen.has(cand)){ seen.add(cand); opts.push(cand); }
  }
  const order = [0,1,2,3];
  shuffle(order);
  return {
    prompt,
    options: order.map(i => opts[i]),
    correct: order.indexOf(0),
    explanation, topic, difficulty
  };
}

/* Shuffle a fixed (hand-written) question's options */
function fixedQ(q){
  const idx = q.options.map((_,i)=>i);
  shuffle(idx);
  return {
    prompt: q.prompt,
    options: idx.map(i => q.options[i]),
    correct: idx.indexOf(q.correct),
    explanation: q.explanation,
    topic: q.topic,
    difficulty: q.difficulty
  };
}

  const c = pick(COMPONENTS);
  const all = COMPONENTS.map(x => x.answer);
  const distractors = shuffle(all.filter(a => a !== c.answer)).slice(0,3);
  return makeQ(

/* --- ADC quantisation step --- */
function genADCStep(){
  const vref = pick([1.8, 2.5, 3.3, 5.0]);
  const bits = pick([8, 10, 12]);
  const levels = 1 << bits;
  const stepMv = (vref * 1000) / levels;

  const correct = stepMv.toFixed(3) + ' mV';
  const d1 = ((vref * 1000) / (levels / 2)).toFixed(3) + ' mV';
  const d2 = ((vref * 1000) / (levels * 2)).toFixed(3) + ' mV';
  const d3 = ((vref * 1000) / (levels - 1)).toFixed(3) + ' mV';

  return makeQ(
    `A <strong>${bits}-bit ADC</strong> has <code>Vref = ${vref} V</code>. What is its ideal quantisation step (LSB size)?`,
    correct, [d1, d2, d3],
    `The ADC divides the reference voltage into <code>2^${bits} = ${levels}</code> levels. ` +
    `Step = Vref / 2^bits = ${vref} V / ${levels} = ${stepMv.toFixed(3)} mV.`,
    "Hardware", bits === 12 ? "Hard" : "Medium"
  );
}

/* --- ADC code -> voltage --- */
function genADCCode(){
  const vref = pick([1.8, 2.5, 3.3, 5.0]);
  const bits = pick([10, 12]);
  const levels = 1 << bits;
  const code = ri(Math.floor(levels / 8), levels - 2);
  const voltage = (code / levels) * vref;

  const correct = voltage.toFixed(3) + ' V';
  const d1 = ((code / (levels - 1)) * vref).toFixed(3) + ' V';
  const d2 = ((code / levels) * vref * 2).toFixed(3) + ' V';
  const d3 = (((code + 1) / levels) * vref).toFixed(3) + ' V';

  return makeQ(
    `A <strong>${bits}-bit ADC</strong> with <code>Vref = ${vref} V</code> returns code <code>${code}</code>. What analogue voltage does this represent (ideal)?`,
    correct, [d1, d2, d3],
    `Ideal ADC: <code>V = code / 2^bits × Vref</code> = ${code} / ${levels} × ${vref} V = ${voltage.toFixed(3)} V.`,
    "Hardware", "Hard"
  );
}

/* --- SysTick reload value --- */
function genSysTick(){
  const mhz = pick([1, 8, 12, 16, 24, 48, 64, 96, 120]);
  const periodMs = pick([1, 10]);
  const ticks = mhz * 1000 * periodMs;
  const reload = ticks - 1;

  return makeQ(
    `A SysTick timer runs at <strong>${mhz} MHz</strong> and must interrupt every <strong>${periodMs} ms</strong>. What reload value gives the correct period?<br><span style="color:#888">(reload = ticks − 1)</span>`,
    String(reload),
    [String(ticks), String(reload - 1), String(Math.floor(ticks / 2))],
    `Ticks per period = f × T = ${mhz}×10^6 × ${periodMs}/1000 = ${ticks}. ` +
    `Reload = ticks − 1 = ${reload}.`,
    "Hardware", "Hard"
  );
}

/* --- Flash last valid address --- */
function genFlashLast(){
  const base = pick([0x08000000, 0x00000000, 0x10000000]);
  const sizeKB = pick([64, 128, 256, 512]);
  const size = sizeKB * 1024;
  const last = base + size - 1;

  const hexBase = '0x' + base.toString(16).toUpperCase().padStart(8,'0');
  const correct = '0x' + last.toString(16).toUpperCase().padStart(8,'0');
  const d1 = '0x' + (base + size).toString(16).toUpperCase().padStart(8,'0');
  const d2 = '0x' + (last - 1).toString(16).toUpperCase().padStart(8,'0');
  const d3 = '0x' + (base + size - 2).toString(16).toUpperCase().padStart(8,'0');

  return makeQ(
    `A linker script maps Flash at <code>${hexBase}</code> with size <strong>${sizeKB} KB</strong>. What is the <strong>last valid byte address</strong>?`,
    correct, [d1, d2, d3],
    `End = base + size − 1 = ${hexBase} + 0x${size.toString(16).toUpperCase()} − 1 = ${correct}. ` +
    `The last valid byte is base + size − 1 because addresses start at 0.`,
    "Toolchain", "Medium"
  );
}

/* --- Ariane 5 int16 overflow --- */
function genArianeOverflow(){
  const k = ri(0, 5);
  const H_O = (32768 + k) * 65536;
  const quotient = 32768 + k;
  const stored = quotient - 65536; // wrap into int16 range

  const prompt = `
    In the Ariane 5 code a 64-bit horizontal velocity
    <code>H_O = ${H_O}</code> is converted by<br><br>
    <code>B_H = (float) H_O / 65536.0;</code><br><br>
    where <code>B_H</code> is a 16-bit signed integer.
    Assuming two's-complement wraparound, what value does <code>B_H</code> hold?`;

  const expl = `H_O / 65536 = ${quotient}, which exceeds the int16_t maximum of 32767. ` +
    `Wrapping modulo 65536 into the signed range gives ${stored}. ` +
    `The missing range check let this out-of-range value corrupt flight control.`;

  return makeQ(
    prompt, String(stored),
    [String(quotient), String(-quotient), String(32767), String(stored - 1)],
    expl, "Case Studies", "Hard"
  );
}

/* --- Bit idiom set/clear/toggle --- */
function genBitIdiom(){
  const n = ri(0, 7);
  const action = pick(['set','clear','toggle']);

  const lines = {
    set:    `x |= (1u &lt;&lt; ${n});`,
    clear:  `x &amp;= ~(1u &lt;&lt; ${n});`,
    toggle: `x ^= (1u &lt;&lt; ${n});`,
    test:   `(x &amp; (1u &lt;&lt; ${n})) != 0`
  };
  const prompt = `Which line <strong>${action}s</strong> bit ${n} of <code>x</code> and leaves every other bit alone?`;
  const correct = lines[action];
  const dist = [lines.set, lines.clear, lines.toggle, lines.test].filter(l => l !== correct);

  const expl = {
    set:    `<code>|=</code> sets (adds a 1). <code>&amp;= ~</code> clears. <code>^=</code> toggles.`,
    clear:  `<code>&amp;= ~</code> clears bits. <code>|=</code> sets. <code>^=</code> toggles.`,
    toggle: `<code>^=</code> is XOR = toggle. <code>|=</code> sets. <code>&amp;= ~</code> clears.`
  }[action];

  return makeQ(prompt, correct, dist, expl, "Embedded C", "Easy");
}

/* --- Popcount --- */
function genPopcount(){
  const v = ri(0x10, 0xFF);
  const c = popcount(v);
  const prompt = `How many bits are set in <code>${hexB(v)}</code>?<br><br><span style="color:#888">Binary: <code>${bin8(v)}</code></span>`;
  const expl = `<code>${hexB(v)} = ${bin8(v)}</code>. Count the 1s: <strong>${c}</strong>.`;

  const dist = [String(c + 1)];
  if (c - 1 >= 0) dist.push(String(c - 1));
  if (8 - c !== c) dist.push(String(8 - c));
  dist.push(String(c + 2));

  return makeQ(prompt, String(c), dist, expl, "Embedded C", "Medium");
}

/* --- Loop iterations = highest set bit + 1 --- */
function genIterations(){
  const topBitPos = ri(2, 31);
  let v;
  if(topBitPos === 31){
    v = (0x80000000 + ri(0, 0x7FFFFFFF)) >>> 0;
  } else {
    v = (((1 << topBitPos) | ri(0, (1 << topBitPos) - 1)) >>> 0);
  }
  const iters = topBitPos + 1;

  const prompt = `
    <pre>uint32_t v = ${hexW(v)};
int n = 0;
while (v) { v >>= 1; n++; }</pre>
    How many times does the loop body run?`;

  const expl = `Iterations = highest set bit position + 1. ` +
    `<code>${hexW(v)}</code> has its top bit at position <code>${topBitPos}</code>, ` +
    `so the loop runs <strong>${iters}</strong> times. ` +
    `(Popcount here is ${popcount(v)} — a different number; it only matters if the body counts bits.)`;

  const dist = [String(popcount(v)), '32', String(iters + 1)];
  if (iters - 1 > 0) dist.push(String(iters - 1));

  return makeQ(prompt, String(iters), dist, expl, "Embedded C", "Hard");
}

/* --- uint8_t truncation --- */
function genTruncate8(){
  const v = ri(0x100, 0xFFF);
  const ans = v & 0xFF;

  const prompt = `
    <code>uint8_t b = 0x${v.toString(16).toUpperCase()};</code><br><br>
    What is <code>b</code>?`;

  const expl = `Assigning to a narrower integer keeps only the low bits. ` +
    `<code>uint8_t</code> keeps 8 bits: <code>0x${v.toString(16).toUpperCase()} &amp; 0xFF = ${hexB(ans)}</code>.`;

  return makeQ(
    prompt, hexB(ans),
    [hexB(v >> 8), hexB((v - 1) & 0xFF), hexB((v + 1) & 0xFF)],
    expl, "Embedded C", "Medium"
  );
}

/* --- Operator precedence trap --- */
function genPrecedence(){
  const x = ri(0x10, 0xFF);
  const mask = pick([0x01,0x02,0x04,0x08,0x10,0x20,0x40,0x80]);
  const op = pick(['==','!=']);

  let correct, expl, dist;
  if(op === '=='){
    correct = '0';
    expl = `<code>==</code> binds tighter than <code>&amp;</code>. So ` +
      `<code>x &amp; ${hexB(mask)} == 0</code> parses as ` +
      `<code>x &amp; (${hexB(mask)} == 0)</code> = <code>x &amp; 0</code> = <strong>0</strong>, ` +
      `for any <code>x</code>. The programmer almost certainly meant <code>(x &amp; ${hexB(mask)}) == 0</code>.`;
    dist = [String(x), hexB(x & mask), '1'];
  } else {
    const low = x & 1;
    correct = String(low);
    expl = `<code>!=</code> binds tighter than <code>&amp;</code>. So ` +
      `<code>x &amp; ${hexB(mask)} != 0</code> parses as ` +
      `<code>x &amp; (${hexB(mask)} != 0)</code> = <code>x &amp; 1</code> — ` +
      `the lowest bit of <code>x</code>. ` +
      `<code>${hexB(x)}</code> has lowest bit <strong>${low}</strong>.`;
    dist = [String(x & mask), '0', '1'];
  }

  const prompt = `
    <code>int x = ${hexB(x)};</code><br>
    <code>int r = x &amp; ${hexB(mask)} ${op} 0;</code><br><br>
    What is <code>r</code>?`;

  return makeQ(prompt, correct, dist, expl, "Embedded C", "Hard");
}

/* --- Arithmetic right shift of negative --- */
function genSignedShift(){
  const neg = -ri(3, 40) * 4;
  const n = ri(1, 3);
  const ans = neg >> n;

  const prompt = `
    <code>int8_t v = ${neg};</code><br>
    <code>v >>= ${n};</code><br><br>
    What is <code>v</code>? (Assume an arithmetic shift — the usual compiler behaviour.)`;

  const expl = `Right-shifting a negative signed value is implementation-defined but in practice ` +
    `<strong>arithmetic</strong>: the sign bit replicates. ` +
    `<code>${neg} >> ${n} = ${ans}</code>. ` +
    `Because the result stays negative, <code>while (v) { v >>= 1; }</code> would loop forever for <code>v = -1</code>.`;

  const dist = [String(Math.abs(neg) >> n), String(neg), String(neg << n)];
  if((neg >> (n - 1)) !== ans) dist.push(String(neg >> (n - 1)));

  return makeQ(prompt, String(ans), dist, expl, "Embedded C", "Hard");
}

/* --- Unsigned right shift (easy warm-up) --- */
function genUnsignedShiftRight(){
  const v = ri(0x40, 0xFF);
  const n = ri(1, 4);
  const ans = (v >> n) & 0xFF;

  const prompt = `
    <code>uint8_t v = ${hexB(v)};</code><br>
    <code>v >>= ${n};</code><br><br>
    What is <code>v</code> afterwards?`;

  const expl = `Right-shift by ${n} = divide by ${1 << n}. ` +
    `<code>${hexB(v)} = ${bin8(v)}</code>. ` +
    `After ${n} shift${n > 1 ? 's' : ''} right: <code>${bin8(ans)}</code> = <code>${hexB(ans)}</code>.`;

  return makeQ(prompt, hexB(ans),
    [hexB((v >> (n - 1)) & 0xFF), hexB((v << n) & 0xFF), hexB((v >> (n + 1)) & 0xFF)],
    expl, "Embedded C", "Easy");
}

/* ============================================================
   Quiz assembly
   ============================================================ */
const GENERATORS = [
  genRTScenario,
  genComponent,
  genADCStep,
  genADCCode,
  genSysTick,
  genFlashLast,
  genArianeOverflow,
  genBitIdiom,
  genPopcount,
  genIterations,
  genTruncate8,
  genPrecedence,
  genSignedShift,
  genUnsignedShiftRight
];

function buildQuiz(n = 12){
  const gens = shuffle(GENERATORS.slice());
  const qs = [];
  const genCount = Math.ceil(n / 2);

  for(let i = 0; i < genCount; i++){
    qs.push(gens[i % gens.length]());
  }

  const fixed = shuffle(FIXED.slice()).slice(0, n - qs.length).map(fixedQ);
  qs.push(...fixed);

  return shuffle(qs);
}

/* ============================================================
   Runner
   ============================================================ */
const main = document.getElementById('main');
const scoreEl = document.getElementById('score');
const barEl = document.getElementById('bar');
const restartBtn = document.getElementById('restart');

let quiz = [];
let idx = 0;
let score = 0;
let answered = false;

function start(){
  quiz = buildQuiz(12);
  idx = 0;
  score = 0;
  answered = false;
  scoreEl.textContent = '0 / 0';
  barEl.style.width = '0%';
  render();
}

function updateBar(){
  const pct = (idx / quiz.length) * 100;
  barEl.style.width = pct + '%';
}

function diffClass(d){
  const k = String(d || '').toLowerCase();
  if(k === 'hard') return 'hard';
  if(k === 'medium') return 'medium';
  return 'easy';
}

function render(){
  if(idx >= quiz.length) return renderDone();

  answered = false;
  const q = quiz[idx];
  scoreEl.textContent = `${score} / ${idx}`;
  updateBar();

  main.innerHTML = `
    <div class="card">
      <div class="qhead">
        <div class="qnum">Question ${idx + 1} of ${quiz.length}</div>
        <div class="badges">
          <span class="badge topic">${q.topic || 'General'}</span>
          <span class="badge ${diffClass(q.difficulty)}">${q.difficulty || 'Medium'}</span>
        </div>
      </div>
      <div class="qtext">${q.prompt}</div>
      <div id="opts"></div>
      <div class="expl" id="expl">
        <div class="tag">Explanation</div>
        ${q.explanation}
      </div>
      <button class="next" id="next" disabled>Next &rarr;</button>
    </div>
  `;

  const optsBox = document.getElementById('opts');
  q.options.forEach((opt, i) => {
    const b = document.createElement('button');
    b.className = 'opt';
    b.innerHTML = opt;
    b.addEventListener('click', () => pickAnswer(i));
    optsBox.appendChild(b);
  });

  document.getElementById('next').addEventListener('click', next);
}

function pickAnswer(i){
  if(answered) return;
  answered = true;

  const q = quiz[idx];
  if(i === q.correct) score++;

  document.querySelectorAll('.opt').forEach((el, j) => {
    el.disabled = true;
    if(j === q.correct) el.classList.add('correct');
    else if(j === i) el.classList.add('wrong');
  });

  document.getElementById('expl').classList.add('show');
  document.getElementById('next').disabled = false;
  scoreEl.textContent = `${score} / ${idx + 1}`;
}

function next(){
  idx++;
  render();
}

function renderDone(){
  updateBar();
  const pct = Math.round((score / quiz.length) * 100);
  let msg;
  if(pct >= 90)      msg = 'Excellent — mechanics are solid.';
  else if(pct >= 70) msg = 'Good. Re-read the ones you missed, then restart.';
  else               msg = 'Keep at it. Restart for a fresh set — repetition builds reflexes.';

  main.innerHTML = `
    <div class="card done">
      <div style="color:#888;font-size:13px;letter-spacing:.05em;text-transform:uppercase;">Session complete</div>
      <div class="big">${score} / ${quiz.length}</div>
      <div class="pct">${pct}%</div>
      <div style="margin-bottom:18px;">${msg}</div>
      <button class="next" id="again">Start a new random set</button>
    </div>
  `;
  document.getElementById('again').addEventListener('click', start);
  scoreEl.textContent = `${score} / ${quiz.length}`;
}

restartBtn.addEventListener('click', start);
start();
</script>
